[workspace]
resolver = "2"
members = [
    "npdf",
    "tiny-poppler",
    "simple-jpegli-enc",
]

[workspace.package]
version = "0.3.0+20260809"
edition = "2024"
authors = ["noaione <noaione@n4o.xyz>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/noaione/npdf"
homepage = "https://github.com/noaione/npdf"
rust-version = "1.88.0"

[workspace.dependencies]
rayon = "1.12.0"
sha2 = "0.11.1"  # for hashing purposes
hex = "0.4.3"

# PDF and images
png = { version = "0.18.1", default-features = false, features = [
    "zlib-rs",
] }
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "lzw"] }
lopdf = { version = "0.46.0", default-features = false, features = ["rayon"] }
flate2 = "1.1.10" # for recompressing PDF stream
fast_image_resize = "6.1.0" # downscaling pages rendered above the output DPI
mangacolor = { git = "https://github.com/noaione/mangacolor" } # ML colour-page detection

# CLI stuff
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
inquire = "0.9.4"
crossbeam-channel = "0.5.17"
num_cpus = "1.17.0"
color-print = "0.3.7"

# Error handling
thiserror = "2.0.21"
color-eyre = { version = "0.6.5", default-features = false, features = ["track-caller"] }

# Build tools
cc = "1.10.0"
cmake = "0.1.58"
walkdir = "2.5.0"
glob = "0.3.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = "limited"

[profile.dev]
debug = "full"
