name: tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  POPPLER_VERSION: "25.11.0"

jobs:
  sanitizer:
    name: sanitizer tests (${{ matrix.os[1] }} - ${{ matrix.sanitizer }})
    runs-on: ${{ matrix.os[0] }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # Linux (x64)
          - [ubuntu-24.04, x86_64-unknown-linux-gnu]
          # macOS Apple Silicon (Tahoe)
          - [macos-26, aarch64-apple-darwin]
        sanitizer:
          - asan
          - lsan
          - tsan
          - ubsan
    
    env:
      CARGO_TERM_COLOR: always
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rustbuild-"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: "1.89.0"


      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libexpat1-dev \
            libbrotli-dev \
            liblzma-dev \
            libbz2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libturbojpeg \
            libturbojpeg0-dev \
            libpng-dev \
            libtiff-dev \
            libopenjp2-7-dev \
            liblcms2-dev \
            libnss3-dev \
            libnspr4-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            pkg-config \
            bzip2 \
            brotli \
            xz \
            expat \
            freetype \
            fontconfig \
            jpeg-turbo \
            libpng \
            libtiff \
            openjpeg \
            lcms2 \
            nss \
            nspr
      
      - name: Build and run tests
        run: |
          if [ "${{ matrix.sanitizer }}" = "lsan" && "${{ runner.os }}" == "macOS" ]; then
            echo "Skipping LeakSanitizer tests on macOS";
            exit 0;
          fi
          cargo test -p tiny-poppler --verbose --features ${{ matrix.sanitizer }}
        shell: bash
