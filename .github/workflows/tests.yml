name: tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  POPPLER_VERSION: "25.11.0"

jobs:
  sanitizer:
    name: sanitizer tests (${{ matrix.os_label }} - ${{ matrix.sanitizer }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os_label: x86_64-unknown-linux-gnu
            sanitizer: asan
            rust_toolchain: stable
            rustflags: ""
            cargo_command: cargo test -p tiny-poppler --verbose --features asan

          - runner: ubuntu-24.04
            os_label: x86_64-unknown-linux-gnu
            sanitizer: lsan
            rust_toolchain: stable
            rustflags: ""
            cargo_command: cargo test -p tiny-poppler --verbose --features lsan

          - runner: ubuntu-24.04
            os_label: x86_64-unknown-linux-gnu
            sanitizer: tsan
            rust_toolchain: nightly
            rustflags: "-Zsanitizer=thread"
            cargo_command: cargo +nightly test -Z build-std --verbose -p tiny-poppler --features tsan

          - runner: ubuntu-24.04
            os_label: x86_64-unknown-linux-gnu
            sanitizer: ubsan
            rust_toolchain: stable
            rustflags: ""
            cargo_command: cargo test -p tiny-poppler --verbose --features ubsan

          - runner: macos-26
            os_label: aarch64-apple-darwin
            sanitizer: asan
            rust_toolchain: stable
            rustflags: ""
            cargo_command: cargo test -p tiny-poppler --verbose --features asan

          - runner: macos-26
            os_label: aarch64-apple-darwin
            sanitizer: tsan
            rust_toolchain: nightly
            rustflags: "-Zsanitizer=thread"
            cargo_command: cargo +nightly test -Z build-std --verbose -p tiny-poppler --features tsan

          - runner: macos-26
            os_label: aarch64-apple-darwin
            sanitizer: ubsan
            rust_toolchain: stable
            rustflags: ""
            cargo_command: cargo test -p tiny-poppler --verbose --features ubsan

    env:
      CARGO_TERM_COLOR: always
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust_toolchain }}
          components: rust-src

      - name: Setup rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rustbuild-"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: "1.89.0"


      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libexpat1-dev \
            libbrotli-dev \
            liblzma-dev \
            libbz2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libturbojpeg \
            libturbojpeg0-dev \
            libpng-dev \
            libtiff-dev \
            libopenjp2-7-dev \
            liblcms2-dev \
            libnss3-dev \
            libnspr4-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            pkg-config \
            bzip2 \
            brotli \
            xz \
            expat \
            freetype \
            fontconfig \
            jpeg-turbo \
            libpng \
            libtiff \
            openjpeg \
            lcms2 \
            nss \
            nspr
      
      - name: Build and run tests
        run: ${{ matrix.cargo_command }}
        shell: bash
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.boost_root }}
          Boost_DIR: ${{ steps.install-boost.outputs.boost_root }}
          CI_RUNNER: "github"
          RUSTFLAGS: ${{ matrix.rustflags }}
          RUSTDOCFLAGS: ${{ matrix.rustflags }}
