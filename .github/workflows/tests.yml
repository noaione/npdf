name: tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  POPPLER_VERSION: "25.11.0"

jobs:
  sanitizer:
    name: sanitizer tests (${{ matrix.os_label }} - ${{ matrix.sanitizer }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os_label: x86_64-unknown-linux-gnu
            sanitizer: asan
            rust_toolchain: stable
            rustflags: ""
            cargo_command: cargo test -p tiny-poppler --verbose --features asan
            target: ""
            target_env: ""
            target_rustflags: ""

          - runner: ubuntu-24.04
            os_label: x86_64-unknown-linux-gnu
            sanitizer: lsan
            rust_toolchain: stable
            rustflags: ""
            cargo_command: cargo test -p tiny-poppler --verbose --features lsan
            target: ""
            target_env: ""
            target_rustflags: ""

          # - runner: ubuntu-24.04
          #   os_label: x86_64-unknown-linux-gnu
          #   sanitizer: tsan
          #   rust_toolchain: nightly
          #   rustflags: ""
          #   cargo_command: cargo +nightly test -Z build-std --verbose -p tiny-poppler --features tsan -- --nocapture test_render_cid
          #   target: x86_64-unknown-linux-gnu
          #   target_env: X86_64_UNKNOWN_LINUX_GNU
          #   target_rustflags: "-Zsanitizer=thread -C debuginfo=2"

          - runner: ubuntu-24.04
            os_label: x86_64-unknown-linux-gnu
            sanitizer: ubsan
            rust_toolchain: stable
            rustflags: ""
            cargo_command: cargo test -p tiny-poppler --verbose --features ubsan
            target: ""
            target_env: ""
            target_rustflags: ""

          - runner: macos-26
            os_label: aarch64-apple-darwin
            sanitizer: asan
            rust_toolchain: stable
            rustflags: ""
            cargo_command: cargo test -p tiny-poppler --verbose --features asan
            target: ""
            target_env: ""
            target_rustflags: ""

          - runner: macos-26
            os_label: aarch64-apple-darwin
            sanitizer: tsan
            rust_toolchain: nightly
            rustflags: ""
            cargo_command: cargo +nightly test -Z build-std --verbose -p tiny-poppler --features tsan
            target: aarch64-apple-darwin
            target_env: AARCH64_APPLE_DARWIN
            target_rustflags: "-Zsanitizer=thread"

          - runner: macos-26
            os_label: aarch64-apple-darwin
            sanitizer: ubsan
            rust_toolchain: stable
            rustflags: ""
            cargo_command: cargo test -p tiny-poppler --verbose --features ubsan
            target: ""
            target_env: ""
            target_rustflags: ""

    env:
      CARGO_TERM_COLOR: always
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust_toolchain }}
          components: rust-src

      - name: Setup rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rustbuild-${{ matrix.sanitizer }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: "1.89.0"


      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libexpat1-dev \
            libbrotli-dev \
            liblzma-dev \
            libbz2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libturbojpeg \
            libturbojpeg0-dev \
            libpng-dev \
            libtiff-dev \
            libopenjp2-7-dev \
            liblcms2-dev \
            libnss3-dev \
            libnspr4-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            pkg-config \
            bzip2 \
            brotli \
            xz \
            expat \
            freetype \
            fontconfig \
            jpeg-turbo \
            libpng \
            libtiff \
            openjpeg \
            lcms2 \
            nss \
            nspr

      - name: Configure target sanitizer flags
        if: ${{ matrix.target != '' }}
        shell: bash
        run: |
          echo "CARGO_TARGET_${{ matrix.target_env }}_RUSTFLAGS=${{ matrix.target_rustflags }}" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${{ matrix.target_env }}_RUSTDOCFLAGS=${{ matrix.target_rustflags }}" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=${{ matrix.rustflags }}" >> "$GITHUB_ENV"
          echo "RUSTDOCFLAGS=${{ matrix.rustflags }}" >> "$GITHUB_ENV"
      
      - name: Build and run tests
        run: ${{ matrix.cargo_command }}
        shell: bash
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.boost_root }}
          Boost_DIR: ${{ steps.install-boost.outputs.boost_root }}
          CI_RUNNER: "github"
          RUSTFLAGS: ${{ matrix.rustflags }}
          RUSTDOCFLAGS: ${{ matrix.rustflags }}
          # TSAN_OPTIONS: "suppressions=${{ github.workspace }}/.tsan.supp"
          # LSAN_OPTIONS: "suppressions=${{ github.workspace }}/.lsan.supp"
          # UBSAN_OPTIONS: "suppressions=${{ github.workspace }}/sanitize.supp"
          # ASAN_OPTIONS: "suppressions=${{ github.workspace }}/sanitize.supp"

  tests-win:
    name: standard tests (windows-2025)
    runs-on: windows-2025

    env:
      CARGO_TERM_COLOR: always
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rust-src

      - name: Setup rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rusttests-wintests"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: "1.89.0"

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install system dependencies
        run: |
          choco install ninja cmake pkgconfiglite -y --no-progress

          cd C:\vcpkg
          .\bootstrap-vcpkg.bat

          # Install some pre-dependencies
          C:\vcpkg\vcpkg.exe install bzip2:x64-windows-static brotli:x64-windows-static liblzma:x64-windows-static --clean-after-build

          # Install required packages as static libraries
          C:\vcpkg\vcpkg.exe install libpng:x64-windows-static zlib:x64-windows-static libiconv:x64-windows-static freetype:x64-windows-static tiff:x64-windows-static openjpeg:x64-windows-static libjpeg-turbo:x64-windows-static lcms:x64-windows-static --clean-after-build
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV
          echo "VCPKG_FEATURE_FLAGS=manifests" >> $env:GITHUB_ENV

          # List manually installed packages for debugging
          echo "Installed vcpkg packages:"
          C:\vcpkg\vcpkg.exe list
          # dir C:\vcpkg\installed\x64-windows-static\bin
          dir C:\vcpkg\installed\x64-windows-static\lib

      - name: Tests
        run: cargo test -p simple-jpegli-enc -vv -- --nocapture
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.boost_root }}
          Boost_DIR: ${{ steps.install-boost.outputs.boost_root }}
          CI_RUNNER: "github"
          RUST_BACKTRACE: "full"
