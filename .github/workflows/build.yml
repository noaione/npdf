name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  POPPLER_VERSION: "25.11.0"

jobs:
  build:
    name: build (${{ matrix.os[1] }})
    runs-on: ${{ matrix.os[0] }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # Linux (x64)
          - [ubuntu-24.04, x86_64-unknown-linux-gnu]
          # # Linux (ARM64)
          # - [ubuntu-24.04-arm, aarch64-unknown-linux-gnu]
          # # macOS Apple Intel (Sonoma)
          # - [macos-15-intel, x86_64-apple-darwin]
          # macOS Apple Silicon (Tahoe)
          - [macos-26, aarch64-apple-darwin]
          # Windows Server 2025 (x64)
          - [windows-2025, x86_64-pc-windows-msvc]
          # # Windows 11 ARM (ARM64)
          # - [windows-11-arm, aarch64-pc-windows-msvc]

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: "1.89.0"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libfreetype6-dev \
            libfontconfig1-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libopenjp2-7-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            pkg-config \
            freetype \
            fontconfig \
            jpeg-turbo \
            libpng \
            libtiff \
            openjpeg \
            boost

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja cmake git pkgconfiglite -y --no-progress
          if (-not (Test-Path "$env:USERPROFILE\\vcpkg")) {
            git clone https://github.com/microsoft/vcpkg "$env:USERPROFILE\\vcpkg"
          }
          & "$env:USERPROFILE\\vcpkg\\bootstrap-vcpkg.bat"
          & "$env:USERPROFILE\vcpkg\vcpkg.exe" install freetype libiconv libpng tiff openjpeg libjpeg-turbo --clean-after-build
          $root = Resolve-Path "$env:USERPROFILE\\vcpkg\\installed\\x64-windows"
          Add-Content $env:GITHUB_ENV "FREETYPE_DIR=$root"
          Add-Content $env:GITHUB_ENV "PNG_DIR=$root"
          Add-Content $env:GITHUB_ENV "TIFF_DIR=$root"
          Add-Content $env:GITHUB_ENV "OPENJPEG_DIR=$root"
          Add-Content $env:GITHUB_ENV "JPEG_DIR=$root"
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$root"
          Add-Content $env:GITHUB_PATH "$root\\bin"

      - name: Build
        run: cargo build --profile release --workspace --all-targets
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.boost_root }}
          Boost_DIR: ${{ steps.install-boost.outputs.boost_root }}

      - name: Compress artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pushd target/release
          chmod +x npdf
          tar -czvf npdf-${{ matrix.os[1] }}.tar.gz npdf
          mv npdf-${{ matrix.os[1] }}.tar.gz ../..
          popd

      - name: Compress artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          pushd target/release
          Compress-Archive -Path npdf.exe -DestinationPath npdf-${{ matrix.os[1] }}.zip
          mv npdf-${{ matrix.os[1] }}.zip ../..
          popd
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: npdf-${{ matrix.os[1] }}
          path: |
            npdf-${{ matrix.os[1] }}.zip
            npdf-${{ matrix.os[1] }}.tar.gz
