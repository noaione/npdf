name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  POPPLER_VERSION: "25.11.0"

jobs:
  build:
    name: build (${{ matrix.os[1] }})
    runs-on: ${{ matrix.os[0] }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # Linux (x64)
          - [ubuntu-24.04, x86_64-unknown-linux-gnu]
          # # Linux (ARM64)
          # - [ubuntu-24.04-arm, aarch64-unknown-linux-gnu]
          # # macOS Apple Intel (Sonoma)
          # - [macos-15-intel, x86_64-apple-darwin]
          # macOS Apple Silicon (Tahoe)
          - [macos-26, aarch64-apple-darwin]
          # Windows Server 2025 (x64)
          - [windows-2025, x86_64-pc-windows-msvc]
          # # Windows 11 ARM (ARM64)
          # - [windows-11-arm, aarch64-pc-windows-msvc]

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rustbuild-"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: "1.89.0"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libfreetype6-dev \
            libfontconfig1-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libopenjp2-7-dev \
            liblcms2-dev \
            libnss3-dev \
            libnspr4-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            pkg-config \
            freetype \
            fontconfig \
            jpeg-turbo \
            libpng \
            libtiff \
            openjpeg \
            lcms2 \
            nss \
            nspr

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        if: runner.os == 'Windows'
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja cmake pkgconfiglite -y --no-progress

          cd C:\vcpkg
          .\bootstrap-vcpkg.bat

          C:\vcpkg\vcpkg.exe install libpng:x64-windows zlib:x64-windows libiconv:x64-windows freetype:x64-windows tiff:x64-windows openjpeg:x64-windows libjpeg-turbo:x64-windows lcms:x64-windows --clean-after-build
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows" >> $env:GITHUB_ENV
          echo "VCPKG_FEATURE_FLAGS=manifests" >> $env:GITHUB_ENV

          # List manually installed packages for debugging
          echo "Installed vcpkg packages:"
          C:\vcpkg\vcpkg.exe list
          dir C:\vcpkg\installed\x64-windows\bin
          dir C:\vcpkg\installed\x64-windows\lib

      - name: Build
        run: cargo build --profile release --workspace --all-targets --verbose
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.boost_root }}
          Boost_DIR: ${{ steps.install-boost.outputs.boost_root }}
          CI_RUNNER: "github"

      - name: Copy DLLs (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run scripts/collect-dependents.py --exe ./target/release/npdf.exe
          dir ./target/release

      - name: Compress artifacts
        run:
          uv run scripts/packer.py
        env:
          MATRIX_NAME: ${{ matrix.os[1] }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: npdf-${{ matrix.os[1] }}
          path: |
            npdf-${{ matrix.os[1] }}.zip
            npdf-${{ matrix.os[1] }}.tar.gz
