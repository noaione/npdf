name: build

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.vscode/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.vscode/**'

# Do not run concurrent builds
concurrency:
  group: "build-npdf-${{ github.ref }}"
  cancel-in-progress: true

env:
  BOOST_VERSION: "1.91.0"

jobs:
  build:
    name: build (${{ matrix.os_label }})
    runs-on: ${{ matrix.runner }}
    if: >
      github.event_name == 'push' ||
      contains(github.event.pull_request.body, '/build')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (x64)
          - runner: ubuntu-26.04
            os_label: x86_64-unknown-linux-gnu
            boost_arch: "x86"
            boost_platform: "24.04"
          # macOS Apple Silicon (Tahoe)
          - runner: macos-26
            os_label: aarch64-apple-darwin
            boost_arch: "aarch64"
            boost_platform: "15"
          # Windows Server 2025 (x64)
          - runner: windows-2025
            os_label: x86_64-pc-windows-msvc
            boost_arch: "x86"
            boost_platform: "2025"

    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e # v7.0.0
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Setup rust cache
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # v2.9.1
        with:
          prefix-key: "rustbuild-"

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: "3.12"

      - name: Install boost
        uses: MarkusJx/install-boost@f9d34f6fe427b8f2ae424d7bf2a3ebccb0dae5a3 # v2.0.0
        id: install-boost
        with:
          boost_version: ${{ env.BOOST_VERSION }}
          platform_version: ${{ matrix.boost_platform }}
          arch: ${{ matrix.boost_arch }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libexpat1-dev \
            libbrotli-dev \
            liblzma-dev \
            libbz2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libturbojpeg0 \
            libturbojpeg0-dev \
            libpng-dev \
            libtiff-dev \
            libopenjp2-7-dev \
            liblcms2-dev \
            libnss3-dev \
            libnspr4-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            pkg-config \
            bzip2 \
            brotli \
            xz \
            expat \
            freetype \
            fontconfig \
            jpeg-turbo \
            libpng \
            libtiff \
            openjpeg \
            lcms2 \
            nss \
            nspr

      - name: Cache vcpkg dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Windows'
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja cmake pkgconfiglite -y --no-progress

          cd C:\vcpkg
          .\bootstrap-vcpkg.bat

          # Install some pre-dependencies
          C:\vcpkg\vcpkg.exe install bzip2:x64-windows-static brotli:x64-windows-static liblzma:x64-windows-static --clean-after-build

          # Install required packages as static libraries
          C:\vcpkg\vcpkg.exe install libpng:x64-windows-static zlib:x64-windows-static libiconv:x64-windows-static freetype:x64-windows-static tiff:x64-windows-static openjpeg:x64-windows-static libjpeg-turbo:x64-windows-static lcms:x64-windows-static --clean-after-build
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV
          echo "VCPKG_FEATURE_FLAGS=manifests" >> $env:GITHUB_ENV

          # List manually installed packages for debugging
          echo "Installed vcpkg packages:"
          C:\vcpkg\vcpkg.exe list
          # dir C:\vcpkg\installed\x64-windows-static\bin
          dir C:\vcpkg\installed\x64-windows-static\lib

      - name: Build
        run: cargo build --profile release --workspace --all-targets -vv
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.boost_root }}
          Boost_DIR: ${{ steps.install-boost.outputs.boost_root }}
          CI_RUNNER: "github"

      - name: Compress artifacts
        run:
          uv run scripts/packer.py
        env:
          MATRIX_NAME: ${{ matrix.os_label }}

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npdf-${{ matrix.os_label }}
          path: |
            npdf-${{ matrix.os_label }}.zip
            npdf-${{ matrix.os_label }}.tar.gz

      - name: Attest build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: npdf-${{ matrix.os_label }}
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}
